name: Influencer EAS Update Preview

on:
  pull_request:
    paths:
      - 'getcollab-mobile-mono/getcollab-influencer/**'
      - 'getcollab-mobile-mono/packages/mobile-shared/**'
      - 'getcollab-mobile-mono/pnpm-lock.yaml'

jobs:
  eas-update:
    name: Publish EAS Update preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: getcollab-mobile-mono/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: getcollab-mobile-mono

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish preview update
        run: pnpm exec eas update --branch=pr-${{ github.event.number }} --message="PR #${{ github.event.number }} — ${{ github.event.pull_request.title }}"
        working-directory: getcollab-mobile-mono/getcollab-influencer

      - name: Comment QR codes on PR
        uses: actions/github-script@v7
        with:
          script: |
            const channel = `pr-${context.issue.number}`
            const link = `https://expo.dev/preview/update?channel-name=${channel}`
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📱 **EAS preview ready (Influencer)**\n\nChannel: \`${channel}\`\nOpen in Expo Go: ${link}\n\nTo install on a device, scan the QR code at the link above.`
            })
