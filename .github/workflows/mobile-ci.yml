name: Mobile CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  typecheck-test:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [getcollab-brand, getcollab-influencer]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@53751a9789c7351e4924f01fe68370252a4f1f18 # v2.4.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter ${{ matrix.app }} run typecheck

      - name: Tests
        run: pnpm --filter ${{ matrix.app }} test --ci --maxWorkers=2
        env:
          CI: true
