appId: in.getcollab.creator
name: Sign in with a seeded account leaves the sign-in screen
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "landing-signin-btn"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "landing-signin-btn"
    retryTapIfNoChange: true
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "sign-in-submit-btn"
- extendedWaitUntil:
    notVisible:
      id: "sign-in-screen"
    timeout: 30000
