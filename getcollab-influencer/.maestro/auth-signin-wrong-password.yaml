appId: in.getcollab.creator
name: A wrong password shows an error and stays on sign in
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "landing-signin-btn"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "landing-signin-btn"
    retryTapIfNoChange: true
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: "wrong-Passw0rd!"
- tapOn:
    id: "sign-in-submit-btn"
- extendedWaitUntil:
    visible: "Couldn't sign in"
    timeout: 20000
