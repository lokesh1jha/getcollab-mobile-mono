appId: in.getcollab.creator
name: A wrong password shows an error and stays on sign in
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "landing-signin-btn"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
# The landing screen can swallow a tap while it animates in; retry until the next screen shows.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "landing-signin-btn"
      - extendedWaitUntil:
          visible:
            id: "sign-in-screen"
          timeout: 5000
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: "wrong-Passw0rd!"
- tapOn:
    id: "sign-in-submit-btn"
- extendedWaitUntil:
    visible: "Couldn't sign in"
    timeout: 20000
