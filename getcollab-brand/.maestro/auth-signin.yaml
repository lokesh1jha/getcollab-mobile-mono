appId: in.getcollab.brand
name: Sign in with a seeded account leaves the sign-in screen
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "landing-sign-in-btn"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
# The landing screen can swallow a tap while it animates in; retry until the next screen shows.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "landing-sign-in-btn"
      - extendedWaitUntil:
          visible:
            id: "sign-in-screen"
          timeout: 5000
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "sign-in-submit-btn"
- extendedWaitUntil:
    notVisible:
      id: "sign-in-screen"
    timeout: 30000
