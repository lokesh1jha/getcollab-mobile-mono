appId: in.getcollab.brand
name: Forgot password opens from sign in
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "landing-sign-in-btn"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
# The landing screen can swallow a tap while it animates in; retry until the next screen shows.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "landing-sign-in-btn"
      - extendedWaitUntil:
          visible:
            id: "sign-in-screen"
          timeout: 5000
- tapOn:
    id: "sign-in-forgot"
- assertVisible: "Send reset link"
