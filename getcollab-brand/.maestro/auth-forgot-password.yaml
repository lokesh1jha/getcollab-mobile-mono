appId: in.getcollab.brand
name: Forgot password opens from sign in
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "landing-sign-in-btn"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "landing-sign-in-btn"
    retryTapIfNoChange: true
- tapOn:
    id: "sign-in-forgot"
- assertVisible: "Send reset link"
